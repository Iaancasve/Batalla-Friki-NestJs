<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Batalla Friki - Arena</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --primary: #e91e63; --bg: #1a1a1a; --card: #2d2d2d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: var(--card); padding: 25px; border-radius: 12px; width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; border: 1px solid #444; }
        .hidden { display: none; }
        .character-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .char-card { border: 2px solid #444; padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; background: #252525; }
        .char-card.selected { border-color: #4caf50; background: #1e2e1e; }
        .hp-bar { width: 100%; height: 18px; background: #444; border-radius: 10px; overflow: hidden; margin: 8px 0; }
        .hp-fill { height: 100%; background: #4caf50; width: 100%; transition: width 0.4s ease; }
        .battle-log { background: #000; height: 150px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 13px; border-radius: 6px; border: 1px solid #444; margin-top: 15px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        button { background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; }
    </style>
</head>
<body>

    <h1>⚔️ Batalla Friki ⚔️</h1>

    <div id="auth-section" class="container">
        <h3>Identificación</h3>
        <input type="email" id="email-input" placeholder="Email" value="prueba@test.com">
        <input type="password" id="password-input" placeholder="Contraseña" value="123456">
        <button onclick="login()">ENTRAR</button>
    </div>

    <div id="selection-section" class="container hidden">
        <h3 id="user-info"></h3>
        <div id="character-list" class="character-grid"></div>
        
        <label>ID Personaje Rival (IA):</label>
        <input type="number" id="rival-id-input" value="2">
        
        <button onclick="startBattle()">¡INICIAR COMBATE!</button>
    </div>

    <div id="battle-section" class="container hidden">
        <h3 id="battle-title">🔥 Combate en curso</h3>
        <div>
            <span id="p-name">Tú</span>
            <div class="hp-bar"><div id="p-hp" class="hp-fill"></div></div>
        </div>
        <div style="margin-top: 20px; text-align: right;">
            <span id="e-name">Rival (IA)</span>
            <div class="hp-bar"><div id="e-hp" class="hp-fill" style="background: #f44336;"></div></div>
        </div>
        <button id="attack-btn" onclick="sendAttack()">💥 ¡ATACAR!</button>
        <div id="battle-log" class="battle-log"></div>
    </div>

    <script>
        let socket, token, user, selectedCharId, currentBattleId;

        async function login() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            try {
                let res = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                
                if(!res.ok) {
                    res = await fetch('http://localhost:3000/auth/register', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({email, password})
                    });
                }

                const data = await res.json();
                token = data.access_token;
                user = data.user;
                initLobby();
                initSocket();
            } catch(e) { alert("Error en Autenticación"); }
        }

        async function initLobby() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('selection-section').classList.remove('hidden');
            document.getElementById('user-info').innerText = `Usuario: ${user.email} (Nivel ${user.level})`;

            const res = await fetch('http://localhost:3000/characters/available', {
                headers: {'Authorization': `Bearer ${token}`}
            });
            const chars = await res.json();
            const list = document.getElementById('character-list');
            list.innerHTML = '';
            
            chars.forEach(c => {
                const div = document.createElement('div');
                div.className = 'char-card';
                div.innerHTML = `<strong>${c.name}</strong><br>⚔️ Atk: ${c.attack}`;
                div.onclick = () => {
                    document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedCharId = c.id;
                };
                list.appendChild(div);
            });
        }

        function initSocket() {
            socket = io('http://localhost:3000', { auth: { token: `Bearer ${token}` } });
            
            socket.on('attackResult', (data) => {
                const log = document.getElementById('battle-log');
                log.innerHTML += `<div>⚔️ ${data.attackerName} ataca a ${data.targetName} (-${data.damageApplied})</div>`;
                document.getElementById('e-hp').style.width = data.targetHp + '%';

                if (data.aiCounterAttack) {
                    setTimeout(() => {
                        log.innerHTML += `<div style="color:orange">🤖 IA responde (-${data.aiCounterAttack.damageApplied} HP)</div>`;
                        document.getElementById('p-hp').style.width = data.aiCounterAttack.targetHp + '%';
                        log.scrollTop = log.scrollHeight;
                    }, 600);
                }

                if (data.isGameOver) {
                    document.getElementById('attack-btn').disabled = true;
                    log.innerHTML += `<h3 style="color:#4caf50">¡BATALLA TERMINADA!</h3>`;
                }
                log.scrollTop = log.scrollHeight;
            });
        }

        async function startBattle() {
            if(!selectedCharId) return alert("Debes seleccionar un personaje de la lista");
            
            // Aquí es donde daba el error: el ID debe coincidir con el input del HTML
            const rivalCharId = parseInt(document.getElementById('rival-id-input').value);

            try {
                const res = await fetch('http://localhost:3000/battles', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                    body: JSON.stringify({ 
                        characterId: selectedCharId, 
                        rivalCharacterId: rivalCharId 
                    })
                });

                if (!res.ok) throw new Error("Error al crear batalla");

                const battle = await res.json();
                currentBattleId = battle.id;
                
                socket.emit('joinBattle', { battleId: currentBattleId });
                
                document.getElementById('selection-section').classList.add('hidden');
                document.getElementById('battle-section').classList.remove('hidden');
            } catch (e) {
                alert(e.message);
            }
        }

        function sendAttack() {
            if (!currentBattleId) return;
            socket.emit('attack', { battleId: currentBattleId });
        }
    </script>
</body>
</html>
